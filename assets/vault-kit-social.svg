<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#100e18"/>
      <stop offset="52%" stop-color="#171325"/>
      <stop offset="100%" stop-color="#211934"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E5794F"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241d38" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#191428" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a3348" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#3a3348" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glowV" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5794F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E5794F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.026" stroke-width="1"/>
    </pattern>
    <!-- fades the left-hand cluster out toward the left edge: the knowledge is leaving -->
    <linearGradient id="fadeMaskGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="45%" stop-color="#a8a8a8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <!-- Must extend well above the topmost card: rotate(-6) lifts a 248px-wide card's top-right
         corner ~26px above its own origin, and a mask edge cuts that corner off silently. -->
    <mask id="fadeLeft">
      <rect x="60" y="150" width="400" height="365" fill="url(#fadeMaskGrad)"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="860" cy="360" rx="360" ry="280" fill="url(#glowV)"/>
  <ellipse cx="500" cy="330" rx="220" ry="200" fill="url(#glowC)"/>

  <!-- ── headline ─────────────────────────────────────────────── -->
  <text x="72" y="90" fill="#F6F3EE" font-size="42" font-weight="700" letter-spacing="-0.6">Projektwissen, das nicht verschwindet</text>
  <text x="72" y="127" fill="#A49CB6" font-size="19">Eine .md-Datei ins Claude-Fenster ziehen — Claude baut die Obsidian-Vault.</text>
  <rect x="72" y="146" width="64" height="4" rx="2" fill="url(#rule)"/>

  <!-- ── LEFT: what disappears ────────────────────────────────── -->
  <g mask="url(#fadeLeft)">
    <g transform="translate(76,214) rotate(-6)">
      <rect width="248" height="62" rx="10" fill="#ffffff" fill-opacity="0.055" stroke="#5a5175" stroke-opacity="0.85"/>
      <text x="18" y="26" fill="#9A91B4" font-size="14.5">Chat-Verlauf</text>
      <rect x="18" y="38" width="196" height="6" rx="3" fill="url(#ghost)"/>
      <text x="168" y="26" fill="#6A6285" font-size="12">scrollt weg</text>
    </g>
    <g transform="translate(92,290) rotate(3.5)">
      <rect width="248" height="62" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#5a5175" stroke-opacity="0.9"/>
      <text x="18" y="26" fill="#9A91B4" font-size="14.5">Agenten-Gedächtnis</text>
      <rect x="18" y="38" width="150" height="6" rx="3" fill="url(#ghost)"/>
      <text x="200" y="26" fill="#6A6285" font-size="12">driftet</text>
    </g>
    <g transform="translate(80,376) rotate(-2.5)">
      <rect width="248" height="62" rx="10" fill="#ffffff" fill-opacity="0.065" stroke="#5a5175" stroke-opacity="0.95"/>
      <text x="18" y="26" fill="#9A91B4" font-size="14.5">Index von Hand</text>
      <rect x="18" y="38" width="172" height="6" rx="3" fill="url(#ghost)"/>
      <text x="196" y="26" fill="#6A6285" font-size="12">veraltet</text>
    </g>
  </g>

  <text x="80" y="484" fill="#6E6688" font-size="15">Drei Orte, eine Eigenschaft:</text>
  <text x="80" y="508" fill="#8B82A8" font-size="15" font-weight="600">sie verschwinden leise.</text>

  <!-- ── MIDDLE: Claude does the transformation ───────────────── -->
  <g transform="translate(352,268)">
    <rect x="0" y="0" width="150" height="94" rx="16" fill="#2a1f24" fill-opacity="0.95" stroke="#E5794F" stroke-opacity="0.5" stroke-width="1.5"/>
    <!-- Claude mark. Solid stroke, not a gradient: a vertical path has a zero-width bounding
         box, so an objectBoundingBox gradient degenerates and never paints. -->
    <g transform="translate(20,26)">
      <g stroke="#E5794F" stroke-width="3.6" stroke-linecap="round">
        <path d="M14 0 V28"/>
        <path d="M0 14 H28"/>
        <path d="M4.1 4.1 L23.9 23.9"/>
        <path d="M23.9 4.1 L4.1 23.9"/>
      </g>
      <circle cx="14" cy="14" r="3.6" fill="#F0885F"/>
    </g>
    <!-- Baseline 46.3, not 40: the star's middle horizontal stroke sits at y=40, and centring the
         CAP height (≈0.70em = 12.6px at 18px) on it puts the baseline half a cap-height below. -->
    <text x="60" y="46.3" fill="#F2E7E0" font-size="18" font-weight="650">Claude</text>
    <text x="20" y="70" fill="#A2938A" font-size="13.5">fragt erst, baut dann</text>

    <path d="M150 47 H206" stroke="url(#rule)" stroke-width="3" stroke-linecap="round"/>
    <path d="M200 38 l12 9 -12 9" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ── RIGHT: the generated index ──────────────────────────── -->
  <g transform="translate(574,178)">
    <rect width="554" height="304" rx="20" fill="url(#panel)" stroke="#7C3AED" stroke-opacity="0.42" stroke-width="1.5"/>

    <!-- Obsidian logo, official mark, unmodified geometry and colour (#7C3AED) -->
    <g transform="translate(32,28) scale(1.75)">
      <path fill="#7C3AED" d="M19.355 18.538a68.967 68.959 0 0 0 1.858-2.954.81.81 0 0 0-.062-.9c-.516-.685-1.504-2.075-2.042-3.362-.553-1.321-.636-3.375-.64-4.377a1.707 1.707 0 0 0-.358-1.05l-3.198-4.064a3.744 3.744 0 0 1-.076.543c-.106.503-.307 1.004-.536 1.5-.134.29-.29.6-.446.914l-.31.626c-.516 1.068-.997 2.227-1.132 3.59-.124 1.26.046 2.73.815 4.481.128.011.257.025.386.044a6.363 6.363 0 0 1 3.326 1.505c.916.79 1.744 1.922 2.415 3.5zM8.199 22.569c.073.012.146.02.22.02.78.024 2.095.092 3.16.29.87.16 2.593.64 4.01 1.055 1.083.316 2.198-.548 2.355-1.664.114-.814.33-1.735.725-2.58l-.01.005c-.67-1.87-1.522-3.078-2.416-3.849a5.295 5.295 0 0 0-2.778-1.257c-1.54-.216-2.952.19-3.84.45.532 2.218.368 4.829-1.425 7.531zM5.533 9.938c-.023.1-.056.197-.098.29L2.82 16.059a1.602 1.602 0 0 0 .313 1.772l4.116 4.24c2.103-3.101 1.796-6.02.836-8.3-.728-1.73-1.832-3.081-2.55-3.831zM9.32 14.01c.615-.183 1.606-.465 2.745-.534-.683-1.725-.848-3.233-.716-4.577.154-1.552.7-2.847 1.235-3.95.113-.235.223-.454.328-.664.149-.297.288-.577.419-.86.217-.47.379-.885.46-1.27.08-.38.08-.72-.014-1.043-.095-.325-.297-.675-.68-1.06a1.6 1.6 0 0 0-1.475.36l-4.95 4.452a1.602 1.602 0 0 0-.513.952l-.427 2.83c.672.59 2.328 2.316 3.335 4.711.09.21.175.43.253.653z"/>
    </g>
    <text x="86" y="47" fill="#EFE9FC" font-size="22" font-weight="650">INDEX.md</text>
    <text x="86" y="69" fill="#8F86A8" font-size="13.5">generiert aus dem Frontmatter · nie von Hand</text>

    <line x1="32" y1="94" x2="522" y2="94" stroke="#ffffff" stroke-opacity="0.09"/>

    <!-- Real index lines, in the real format. One <text> per line with tspans, NOT absolute x per
         fragment: monospace advance widths differ per font, so hand-placed offsets collide the
         moment the fallback font changes. -->
    <g font-family="Cascadia Code, Consolas, JetBrains Mono, monospace" font-size="13">
      <text x="32" y="124">
        <tspan fill="#8B82A8">- [[</tspan><tspan fill="#C9B6FF">Projekt/00_Notes/notiz</tspan><tspan fill="#8B82A8">|</tspan><tspan fill="#DED7F2">Titel</tspan><tspan fill="#8B82A8">]] </tspan><tspan fill="#7A7196">— Summary · 2026-07-27</tspan>
      </text>
      <text x="32" y="152">
        <tspan fill="#8B82A8">- [[</tspan><tspan fill="#C9B6FF">Projekt/01_Issues/ISSUE-42</tspan><tspan fill="#8B82A8">|</tspan><tspan fill="#DED7F2">Titel</tspan><tspan fill="#8B82A8">]] </tspan><tspan fill="#7A7196">— Summary · #42</tspan>
      </text>
      <text x="32" y="180">
        <tspan fill="#8B82A8">- [[</tspan><tspan fill="#C9B6FF">Projekt/03_technical_docs/seite</tspan><tspan fill="#8B82A8">|</tspan><tspan fill="#DED7F2">Titel</tspan><tspan fill="#8B82A8">]]</tspan>
      </text>
    </g>

    <line x1="32" y1="208" x2="522" y2="208" stroke="#ffffff" stroke-opacity="0.09"/>

    <!-- the guards, with denominators -->
    <g font-family="Cascadia Code, Consolas, JetBrains Mono, monospace" font-size="13.5">
      <g transform="translate(32,242)">
        <circle cx="5" cy="-4" r="4" fill="none" stroke="#5FD08A" stroke-width="2"/>
        <text x="22" y="0" fill="#9FE3B8">Index</text>
        <text x="84" y="0" fill="#6F6690">262 / 23 Kategorien</text>
      </g>
      <g transform="translate(32,270)">
        <circle cx="5" cy="-4" r="4" fill="none" stroke="#5FD08A" stroke-width="2"/>
        <text x="22" y="0" fill="#9FE3B8">Links</text>
        <text x="84" y="0" fill="#6F6690">444 / 444</text>
      </g>
      <g transform="translate(300,242)">
        <circle cx="5" cy="-4" r="4" fill="none" stroke="#5FD08A" stroke-width="2"/>
        <text x="22" y="0" fill="#9FE3B8">Checks</text>
        <text x="92" y="0" fill="#6F6690">805 / 805</text>
      </g>
      <g transform="translate(300,270)">
        <path d="M1 -8 L9 0 M9 -8 L1 0" stroke="#E5794F" stroke-width="2" stroke-linecap="round"/>
        <text x="22" y="0" fill="#EFA98A">Exit</text>
        <text x="84" y="0" fill="#6F6690">≠ 0 bei Defekt</text>
      </g>
    </g>
  </g>

  <!-- ── bottom chips ─────────────────────────────────────────── -->
  <!-- Uniform pill width, text centred both ways. y=26.25 puts the CAP band's middle on the pill's
       centre line (42/2 = 21, plus half a 0.70em cap height at 15px). text-anchor centres the run
       regardless of its length, so no pill needs its own hand-measured padding. -->
  <g transform="translate(72,540)" font-size="15" text-anchor="middle">
    <g>
      <rect width="278" height="42" rx="21" fill="#ffffff" fill-opacity="0.045" stroke="#E5794F" stroke-opacity="0.42"/>
      <text x="139" y="26.25" fill="#EFE3DA">Eine Erkenntnis, eine Datei</text>
    </g>
    <g transform="translate(298,0)">
      <rect width="278" height="42" rx="21" fill="#ffffff" fill-opacity="0.045" stroke="#A78BFA" stroke-opacity="0.42"/>
      <text x="139" y="26.25" fill="#E8E1F7">Index generiert, nie geschrieben</text>
    </g>
    <g transform="translate(596,0)">
      <rect width="278" height="42" rx="21" fill="#ffffff" fill-opacity="0.045" stroke="#A78BFA" stroke-opacity="0.42"/>
      <text x="139" y="26.25" fill="#E8E1F7">Keine Zahl ohne ihren Nenner</text>
    </g>
  </g>

  <!-- Below the chip row, not beside it: the widened pills reach x=946 and this run starts at ~914
       when right-anchored at 1128, so keeping it on the chip baseline would overlap chip 3. -->
  <text x="1128" y="602" text-anchor="end" fill="#6C6488" font-size="13">Claude Code × Obsidian · Vault Kit</text>
</svg>
